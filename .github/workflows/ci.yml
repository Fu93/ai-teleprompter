name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # e2e 走真 Electron 視窗(顯示/全域熱鍵),windows runner 免 xvfb 可直接跑
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (required by e2e)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # 封鎖套件 = package.json 的 test:e2e(16 個 spec,單一來源避免兩處清單漂移):
      # 含資料安全(backup)、關閉守衛(confirm-close)、崩潰復原(error-boundary)、
      # 完整使用者旅程(user-journey/blindspot)等回歸。meeting-flow 不在此列 ——
      # 它自我宣告為時序敏感的演示 spec,由下一步 best-effort 執行、不擋 merge。
      - name: E2E (blocking suite)
        run: npm run test:e2e

      # meeting-flow 是時序敏感的演示 spec:CI 上嘗試執行但不擋 merge
      - name: E2E meeting-flow (best effort)
        run: npx playwright test e2e/meeting-flow.spec.ts
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-artifacts
          path: |
            test-results/
            docs/screenshots/
          retention-days: 7
