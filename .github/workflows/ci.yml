name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    # e2e 走真 Electron 視窗(顯示/全域熱鍵),windows runner 免 xvfb 可直接跑
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # lint 分兩個步驟,而且順序有意義:
      #   1) eslint .          —— error 當場擋(未使用變數、失效的 disable 指示…)
      #   2) lint-baseline.mjs —— warning 不得**增加**(上限在 eslint-baseline.json)
      # 只有第 1 步的話,既有 21 筆 warning 會變成一個只增不減的黑洞;
      # 只有第 2 步的話,新增的 error 又會被上限定義的規則集合漏掉。
      #
      # 第 1 步擋下來的**真實缺陷**範例:App.tsx 的導航橋原本登錄了一份
      # 閉包快照(scriptsDirty=false),按一下 toast 的「前往設定」就會靜默
      # 丟掉未存講稿 —— 正是那支橋存在的理由。exhaustive-deps 抓到它。
      - name: Lint
        run: npm run lint

      - name: Lint baseline (warnings must not increase)
        run: npm run lint:baseline

      - name: Unit tests
        run: npm test

      - name: Build (required by e2e)
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      # 假麥克風 fixture 不入庫(.gitignore),而 practice-generation.spec.ts 靠
      # voice-2seg.wav 讓 VAD 自然切出兩段 —— 沒有它,那條 spec 會**永遠 skip**,
      # 於是「多了一條測試」與「多了一條永遠綠的空測試」長得一模一樣。
      # 與 audit job 的同一步驟對稱;離線產生(有 SAPI 用真語音,沒有用合成波形)。
      - name: Generate audio fixture (required by practice-generation e2e)
        run: npm run make-audio-fixture

      # 封鎖套件的清單在 e2e/manifest.mjs —— 單一來源。CI 與本地閘門
      # (release-gate.mjs)都從那裡讀,不再各自列一份檔名。
      # e2eManifest.test.ts 會擋住「新增一支 spec 卻沒登記」的情況:
      # 未登記的 spec 在 CI 上不會被跑到,而「沒被跑到」在報告上與「通過」
      # 長得一樣 —— 這是本專案記錄過最貴的一次教訓。
      - name: E2E (blocking suite)
        run: npm run test:e2e

      # 非阻塞但**一定有報告**的一組(manifest.mjs 裡寫明了每一支的理由)。
      # 沒有 continue-on-error 之外的任何 suppression:它紅了就紅,報告照上傳。
      - name: E2E advisory suite (non-blocking, always reported)
        run: npm run test:e2e:advisory
        continue-on-error: true

      # 上傳條件是 always() 而不是 failure():
      # 「跑了但紅」與「沒跑」必須在 artifacts 上可分辨。原先只在 failure()
      # 上傳,而全綠時使用者無從知道那一組到底跑了沒有。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-artifacts
          path: |
            test-results/
          retention-days: 7
        # e2e 的截圖已改寫到 test-results/screenshots/(gitignored):
        # docs/screenshots/ 是被追蹤的文件資產,讓 e2e 直接覆寫會讓工作樹
        # 常態性變髒。刻意刷新文件截圖用 scripts/capture-ui.mjs。

  audit:
    # 六支 UI/UX 稽核(ui/deep/states/edge/journey/effects)也擋 merge:
    # 只在本地 release-gate 跑的話,push/PR 弄壞覆蓋率(新增按鈕沒登記、狀態數縮水)
    # 時 CI 仍是綠的。腳本自己設 AI_TP_AUDIT=1 與 AI_TP_E2E=1(各 audit-*.mjs 檔頭)。
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 稽核用 electron.launch({ args: ['.'] }) 啟動的是 out/ 建置產物
      - name: Build (audits launch the built app)
        run: npm run build

      # fixtures/audit 不入庫(gitignore);沒有 fixture 的話錄音探針會變 unverifiable,
      # works 數掉到基線以下。make-audio-fixture 離線:有 SAPI 用真語音,沒有就用合成波形。
      - name: Generate audio fixture
        run: npm run make-audio-fixture

      - name: UI/UX audits (blocking)
        run: npm run audit

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: audit-artifacts
          path: docs/audit/
          retention-days: 7
