appId: tw.nn201.ai-teleprompter
productName: AI 提詞機
directories:
  output: dist
files:
  - out/**
  - '!node_modules/**'
asar: true
compression: maximum
# 場景包:main/packs.ts 掃 process.resourcesPath/packs
extraResources:
  - from: assets/packs
    to: packs
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  unicode: true
  shortcutName: AI 提詞機
